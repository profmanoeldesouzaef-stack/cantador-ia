name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Assinatura fixa: sem isso cada build teria chave nova e a atualização
      # não instalaria por cima (teria que desinstalar e perder o caderno).
      - name: Usar a mesma assinatura em todo build
        run: mkdir -p ~/.android && cp assinatura/debug.keystore ~/.android/debug.keystore

      - name: Completar projeto Android
        run: |
          flutter create --platforms=android --org br.cantador --project-name cantador .
          rm -f test/widget_test.dart

      - run: flutter pub get

      - name: Análise
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testes
        run: flutter test

      - name: Compilar APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          mv build/app/outputs/flutter-apk/app-release.apk build/cantador-ia.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cantador-ia-apk
          path: app/build/cantador-ia.apk

      - name: Publicar versão para baixar no celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Cantador IA v0.1.${{ github.run_number }}
          files: app/build/cantador-ia.apk
          body: Baixe o cantador-ia.apk no celular e instale (permita "instalar apps desconhecidos").
